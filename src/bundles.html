<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bundle inspector - AR.IO</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101719;color:#e6edef}*{box-sizing:border-box}body{max-width:1080px;margin:auto;padding:36px 24px}header,.row,nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:28px;margin:0}h2{font-size:18px}p{color:#a5b6bb;line-height:1.6}a{color:#8bdbc6}form,section{background:#192326;border:1px solid #304044;border-radius:12px;padding:24px;margin-top:20px}label{display:block;margin-bottom:10px;font-weight:600}input{min-width:0;flex:1;background:#101719;color:inherit;border:1px solid #60777c;border-radius:6px;padding:12px;font:inherit}button{background:#8bdbc6;color:#10221d;border:0;border-radius:6px;padding:12px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #e6edef;outline-offset:4px}output{display:block;margin-top:14px;white-space:pre-wrap}summary{cursor:pointer;overflow-wrap:anywhere;padding:12px 0;font-family:ui-monospace,monospace}details+details{border-top:1px solid #304044}dl{display:grid;grid-template-columns:150px 1fr;gap:10px}dt{color:#a5b6bb}dd{margin:0;overflow-wrap:anywhere;font-family:ui-monospace,monospace}.tags{width:100%;border-collapse:collapse;table-layout:fixed}.tags td,.tags th{text-align:left;padding:8px;border-bottom:1px solid #304044;overflow-wrap:anywhere}.warning{color:#edc879}pre{white-space:pre-wrap;overflow-wrap:anywhere}#paging{margin-top:20px}@media(max-width:600px){body{padding:20px 12px}section,form{padding:16px}dl{grid-template-columns:1fr}dd{margin-bottom:8px}}
</style>
</head>
<body>
<header><h1>Bundle inspector</h1><a href="/ar-io/diagnostics">Diagnostics</a></header>
<main>
<form id="form"><label for="id">Bundle or item ID</label><div class="row"><input id="id" required pattern="[A-Za-z0-9_-]{43}" maxlength="43" autocomplete="off" spellcheck="false"><button type="submit">Inspect</button></div><p>Uses indexed metadata when available. External item metadata and binary bundle headers are shown as unverified. Item payloads are not downloaded.</p><output id="status" aria-live="polite"></output></form>
<section id="results" hidden><h2 id="heading"></h2><p id="trust"></p><button id="remote" type="button" hidden>Read unverified headers</button><div id="items"></div><nav id="paging" aria-label="Bundle pages"><button id="previous" type="button">Previous</button><span id="position"></span><button id="next" type="button">Next</button></nav></section>
</main>
<noscript>JavaScript is required to inspect bundles.</noscript>
<script>
const el = id => document.getElementById(id);
let current = '', start = 0, unindexed = false, busy = false;
function setBusy(value) {
  busy = value;
  document.querySelectorAll('button').forEach(button => {button.disabled = value || button.dataset.unavailable === 'true';});
}
async function request(body) {
  const response = await fetch('/ar-io/bundles/inspect', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const text = await response.text();
  if (!response.ok) {
    let message = text;
    try {message = JSON.parse(text).error || text;} catch {}
    throw new Error(message);
  }
  return JSON.parse(text);
}
function field(list, name, value) {
  const term = document.createElement('dt'), description = document.createElement('dd');
  term.textContent = name; description.textContent = value == null || value === '' ? '-' : String(value);
  list.append(term, description);
}
function details(container, item) {
  container.replaceChildren();
  const list = document.createElement('dl');
  for (const [name,key] of [['ID','id'],['Source','source'],['Item offset','item_offset'],['Item bytes','item_size'],['Payload offset within item','data_offset'],['Payload bytes','data_size'],['Signature type','signature_type'],['Owner public key','owner'],['Owner address','owner_address'],['Target','target'],['Anchor','anchor'],['Signature','signature']]) field(list,name,item[key]);
  container.append(list);
  if (item.parent_id) {
    const link = document.createElement('a'); link.href = '/ar-io/bundles?id=' + encodeURIComponent(item.parent_id);
    link.textContent = 'Inspect parent bundle: ' + item.parent_id; container.append(link);
  } else if (item.index == null) {
    const note = document.createElement('p'); note.textContent = 'Parent bundle unavailable in this metadata.'; container.append(note);
  }
  if (item.bundle) {
    const link = document.createElement('a');
    link.href = '/ar-io/bundles?id=' + encodeURIComponent(item.id); link.textContent = 'Inspect nested bundle'; container.append(link);
  }
  const title = document.createElement('h3'); title.textContent = 'Tags'; container.append(title);
  if (!item.tags.length) {const p = document.createElement('p'); p.textContent = 'No tags'; container.append(p);}
  else {
    const table = document.createElement('table'); table.className = 'tags';
    const head = document.createElement('tr');
    for (const name of ['Name','Value']) {const th = document.createElement('th'); th.scope = 'col'; th.textContent = name; head.append(th);} table.append(head);
    for (const tag of item.tags) {const row = document.createElement('tr'); for (const key of ['name','value']) {const cell = document.createElement('td'); cell.textContent = tag[key]; row.append(cell);} table.append(row);} container.append(table);
  }
  const raw = document.createElement('details'), summary = document.createElement('summary'), pre = document.createElement('pre');
  summary.textContent = 'Raw metadata (tag bytes in base64url)'; pre.textContent = JSON.stringify(item,null,2); raw.append(summary,pre); container.append(raw);
}
async function inspect(id, position = 0, remote = false) {
  if (busy) return;
  setBusy(true); el('status').textContent = 'Reading metadata...'; el('results').hidden = true;
  try {
    const page = await request({id,start:position,unindexed:remote});
    current = id; start = position; unindexed = page.source === 'unverified';
    const single = page.kind === 'item';
    el('heading').textContent = single ? 'Item details' : page.format + ' bundle';
    el('trust').textContent = unindexed ? 'Unverified - item signatures and payloads have not been checked.' : (single ? 'Indexed metadata.' : (page.complete ? 'Indexed metadata. Root bundle indexing is complete.' : 'Indexed metadata. Root bundle indexing is incomplete. This list may omit items.'));
    el('trust').className = unindexed || (!single && !page.complete) ? 'warning' : '';
    el('paging').hidden = single;
    el('remote').hidden = unindexed || page.complete || page.format !== 'binary';
    el('items').replaceChildren();
    for (const item of page.items) {
      const row = document.createElement('details'), summary = document.createElement('summary'), content = document.createElement('div');
      summary.textContent = (item.index == null ? '' : (item.index + 1) + '. ') + item.id + ' - ' + (item.item_size || item.data_size) + ' bytes'; row.append(summary,content);
      row.open = single;
      if (item.tags) details(content,item);
      else {
        const load = document.createElement('button'); load.type = 'button'; load.textContent = 'Load unverified header'; content.append(load);
        load.addEventListener('click',async () => {
          if (busy) return;
          setBusy(true); el('status').textContent = 'Reading item header...';
          try {
            const result = await request({id:current,start,unindexed:true,item:item.index});
            if (!result.items.length) throw new Error('Item is unavailable');
            details(content,result.items[0]); el('status').textContent = 'Header loaded. Data remains unverified.';
          } catch (error) {el('status').textContent = error.message;} finally {setBusy(false);}
        });
      }
      el('items').append(row);
    }
    if (!page.items.length) el('items').textContent = 'No visible indexed items or an empty bundle.';
    el('previous').dataset.unavailable = String(start === 0); el('next').dataset.unavailable = String(!page.has_more);
    el('position').textContent = 'Page ' + (Math.floor(start / 25)+1) + (page.total == null ? '' : ' - ' + page.total + ' items');
    el('results').hidden = false; el('status').textContent = 'Metadata loaded.';
  } catch (error) {el('status').textContent = error.message;} finally {setBusy(false);}
}
el('form').addEventListener('submit',event => {event.preventDefault(); inspect(el('id').value.trim());});
el('previous').addEventListener('click',() => inspect(current,Math.max(0,start-25),unindexed));
el('next').addEventListener('click',() => inspect(current,start+25,unindexed));
el('remote').addEventListener('click',() => inspect(current,0,true));
const initial = new URLSearchParams(location.search).get('id');
if (initial && /^[A-Za-z0-9_-]{43}$/.test(initial)) {el('id').value = initial; inspect(initial);}
</script>
</body>
</html>
