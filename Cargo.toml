[package]
name = "ar-io-gateway"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
default-run = "ar-io-gateway"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast"] }
bs58 = "0.5"
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
parking_lot = "0.12"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
rsa = "0.9.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
sha2 = "0.10"
sha3 = { version = "0.12", default-features = false }
solana-pubkey = { version = "4.3", features = ["curve25519"] }
tempfile = "3.27"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-postgres = "0.7"
tokio-util = { version = "0.7", features = ["io", "io-util", "rt"] }
fs4 = { version = "0.13.1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }
